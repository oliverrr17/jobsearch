<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>岗位研究台 · 上海</title><link rel="stylesheet" href="/style.css?v=1.3.0"><body><header><span class="brand">研 / 职</span><span>RESEARCH CAREER DESK</span><small>本机工作区 · 上海 · v1.3</small></header><main><aside><p class="eyebrow">01 / 搜索配置</p><h1>让下一个岗位<br>更接近你的研究。</h1><p class="sub">搜索、筛选、保留证据。职位与登录状态存于本机。</p><form id="config"><label>检索关键词<textarea id="keywords" rows="7" required></textarea></label><label>每个关键词最多浏览<select id="pages"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option></select>批列表</label><fieldset><legend>网站</legend><label><input type="checkbox" name="site" value="boss" checked>BOSS直聘</label><label><input type="checkbox" name="site" value="liepin" checked>猎聘</label><label><input type="checkbox" name="site" value="maimai" checked>脉脉</label></fieldset><label><input id="finance" type="checkbox" checked>优先金融研究岗位</label><label><input id="intern" type="checkbox" checked>排除实习与校招</label><details><summary>脉脉职位页入口</summary><input id="maimaiUrl" type="url"><p>首次登录后进入职位搜索页。入口变化时可填入新地址；搜索框未识别时使用“采集当前页”。</p></details><button type="submit" class="secondary">保存配置</button></form><p class="small">城市缺失的岗位标记“待确认”；筛选结果不等于职位适合度判断。</p></aside><section class="workspace"><div class="section-head"><div><p class="eyebrow">02 / 浏览与归档</p><h2>上海金融研究职位</h2></div><div id="counts" class="counts">0<span>匹配岗位</span></div></div><div class="sites" id="sites"></div><div class="actions"><button id="start">开始批量浏览</button><button id="resume" class="secondary">继续</button><button id="stop" class="secondary">停止</button><button id="skip" class="quiet">跳过当前关键词</button></div><div class="status" role="status" aria-live="polite"><strong id="status">准备就绪</strong><span id="progress"></span><p id="message">先打开网站，在工具浏览器中完成登录。</p></div><details class="logs"><summary>浏览记录</summary><pre id="log"></pre></details><div class="toolbar"><label>显示<select id="filter"><option value="match">匹配岗位</option><option value="all">全部采集</option><option value="saved">已收藏</option></select></label><input id="search" placeholder="在结果中搜索公司、岗位或关键词"><a id="csv" href="/api/export">导出 CSV</a><a id="json" href="/api/export?format=json">JSON</a></div><div id="results" class="results"><div class="empty">尚未采集岗位<br><span>登录网站后开始批量浏览，或采集当前搜索结果页。</span></div></div></section></main><div id="toast" role="alert"></div><script type="module" src="/app.js?v=1.3.0"></script></body></html>
